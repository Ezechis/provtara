<label class="secret">{{ pwd_label or "Password" }}
  <span class="secret-row">
    <input
      type="password"
      name="password"
      required
      {% if pwd_minlength %}minlength="{{ pwd_minlength }}"{% endif %}
      autocomplete="{{ pwd_autocomplete or 'current-password' }}"
    >
    <button type="button" class="secret-toggle" aria-pressed="false" aria-label="Show password">Show</button>
  </span>
</label>
