{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<h1>Log in</h1>
<form class="stack" method="post">
  <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
  <label>Email <input type="email" name="email" required></label>
  {% with pwd_label="Password", pwd_autocomplete="current-password" %}
    {% include "_password_field.html" %}
  {% endwith %}
  <button class="btn" type="submit">Log in</button>
</form>
<p class="muted"><a href="{{ url_for('forgot') }}">Forgot your password?</a></p>
<p class="muted">New? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
