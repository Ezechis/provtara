# Free web service on Render.com — no card required for the free tier.
# Dashboard: New → Blueprint → this repo, or New Web Service.
services:
  - type: web
    name: provtara
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r phase1/requirements.txt
    startCommand: gunicorn --chdir phase1 -b 0.0.0.0:$PORT run:app --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: phase1/src:phase0/src
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
