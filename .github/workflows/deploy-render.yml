name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r phase1/requirements.txt

      - name: Test
        env:
          PYTHONPATH: phase1/src:phase0/src
        run: python -m pytest phase0/tests phase1/tests -q --tb=line

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-da4ai97qj5pc73blfs6g
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "Missing GitHub secret RENDER_API_KEY."
            echo "Create an Account API key in the Render dashboard and set it with:"
            echo "  gh secret set RENDER_API_KEY --repo Ezechis/provtara"
            exit 1
          fi
          code=$(curl -sS -o /tmp/render-deploy.json -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${GITHUB_SHA}\"}")
          echo "Render HTTP ${code}"
          python -c "import json; print(json.load(open('/tmp/render-deploy.json')))"
          case "$code" in
            200|201|202) ;;
            *) exit 1 ;;
          esac
